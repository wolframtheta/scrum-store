<div class="calendar-grid">
  <div class="calendar-weekday-header">
    @for (wd of weekdays; track wd) {
      <span class="calendar-weekday-cell">{{ wd }}</span>
    }
  </div>
  @for (row of grid(); track $index) {
    <div class="calendar-week-row">
      @for (cell of row; track cell.dateStr ?? $index) {
        <button
          type="button"
          class="calendar-day-cell"
          [class.other-month]="!cell.isCurrentMonth"
          [class.today]="cell.isToday"
          [class.selected]="cell.dateStr === selectedDate()"
          [class.non-votable]="cell.dateStr && !isDayVotable(cell.dateStr)"
          [disabled]="!cell.dateStr || loading() || savingDate() !== null || (cell.dateStr ? !isDayVotable(cell.dateStr) : false)"
          (click)="cell.dateStr && onDayClick(cell.dateStr)"
        >
          @if (cell.dateStr) {
            <span class="calendar-day-number">{{ cell.dayOfMonth }}</span>
            @if (getMyVote(cell.dateStr); as vote) {
              <span class="calendar-vote" [attr.data-vote]="vote">
                {{ vote === 'yes' ? ('PROFILE.CALENDAR_VOTE_YES' | translate) : vote === 'no' ? ('PROFILE.CALENDAR_VOTE_NO' | translate) : ('PROFILE.CALENDAR_VOTE_IF_NEEDED' | translate) }}
              </span>
            }
            @if (savingDate() === cell.dateStr) {
              <ion-spinner name="crescent" class="calendar-day-spinner"></ion-spinner>
            }
          }
        </button>
      }
    </div>
  }
</div>
